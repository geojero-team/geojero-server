spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

tour:
  info-key: ${TOUR_INFO_KEY}
  info-base-url: https://apis.data.go.kr/B551011/KorService2
  photo-key: ${TOUR_PHOTO_KEY}
  photo-base-url: https://apis.data.go.kr/B551011/PhotoGalleryService1

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}