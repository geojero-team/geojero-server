spring:
  application:
    name: geojero-server
  profiles:
    active: local

server:
  port: 8080

cors:
  allowed-origins:
    - http://localhost:5173
    - https://geojero-client.vercel.app
    - https://geojero-client-*.vercel.app

management:
  endpoints:
    web:
      exposure:
        include: health